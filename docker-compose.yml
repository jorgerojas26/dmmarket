services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64
    ports:
      - "127.0.0.1::3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bdsolser_md_nieto
    command: --sql-mode="" --log-bin-trust-function-creators=1
    labels:
      io.dmmarket.worktree: "${DMMARKET_DEV_ROOT:?Usa bun run dev}"
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/mysql/.dmmarket-dev-seed-ready && mysqladmin ping --protocol=tcp -h 127.0.0.1 -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 240
      start_period: 10s
    volumes:
      - type: bind
        source: "${DMMARKET_DEV_DUMP:?Usa bun run dev}"
        target: /docker-entrypoint-initdb.d/dump.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DMMARKET_DEV_ROOT}/docker/dev-ready.sh"
        target: /docker-entrypoint-initdb.d/zz-dmmarket-ready.sh
        read_only: true
        bind:
          create_host_path: false
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
    labels:
      io.dmmarket.worktree: "${DMMARKET_DEV_ROOT:?Usa bun run dev}"
