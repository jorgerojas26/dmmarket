services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64
    container_name: dm_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bdsolser_md_nieto
    command: --sql-mode="" --log-bin-trust-function-creators=1
    volumes:
      - ./bdsolser_md_nieto.dump:/docker-entrypoint-initdb.d/dump.sql
      - mysql_data_57:/var/lib/mysql

volumes:
  mysql_data_57:
